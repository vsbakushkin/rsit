name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # nothing in CI reads debug info; dropping it keeps the cache small
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # PRs restore main's cache but do not save their own
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      # gpui's Linux dependencies (same list as gpui-component's CI)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # same job as the build so clippy reuses its dependencies
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
