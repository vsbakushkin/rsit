[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-diff"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "max-performance-safe", "revision", "blob-diff", "index", "status", "mailmap"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rsit-graph = { path = "crates/rsit-graph" }
rsit-git = { path = "crates/rsit-git" }
rsit-log = { path = "crates/rsit-log" }

[profile.dev.package."*"]
opt-level = 2
